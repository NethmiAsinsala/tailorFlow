<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a0038">
    <title>Owner Login - Thanu Fashion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">
    <main class="auth-card">
        <div class="p-4 p-md-5">
            <a class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4" href="../index.html">
                <span class="brand-emblem" aria-hidden="true">TF</span>
                <span class="auth-title">Thanu Fashion</span>
            </a>

            <p class="eyebrow">Shop Manager</p>
            <h1 class="h3 fw-bold mb-2">Welcome back</h1>
            <p class="text-muted mb-4">Sign in to manage your tailoring business.</p>

            <div id="loginMessage" class="alert d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" autocomplete="email" placeholder="owner@example.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-gold btn-lg w-100" id="loginButton">Sign in</button>
            </form>

            <p class="small text-muted text-center mt-4 mb-0">Perfect fit, perfect you</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
